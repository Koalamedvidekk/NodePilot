name: Publish NodePilot release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-updater:
    name: Verify Windows update and recovery
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test Windows updater and process handoff
        run: npx tsx --test server/test/update-handoff.test.ts server/test/update-process.test.ts server/test/windows-update-helper.test.ts
      - name: Test Minecraft version changes on Windows
        run: npx tsx --test server/test/server-version-service.test.ts server/test/version-runtime-integration.test.ts
      - name: Test queued add-on changes and recovery on Windows
        run: npx tsx --test server/test/addon-service.test.ts server/test/addon-change-service.test.ts
      - name: Test Worlds layouts, transfers and recovery on Windows
        run: npx tsx --test server/test/world-foundation.test.ts server/test/world-transfers-packs.test.ts server/test/world-routes.test.ts server/test/world-overlap.test.ts server/test/world-restore-transition.test.ts
      - name: Build and verify the Versions and Worlds APIs
        run: |
          npm run build -w server
          node scripts/test-versions-api.mjs
          node scripts/test-worlds-api.mjs
          node scripts/test-addon-queue-api.mjs

  release:
    name: Test, package, and publish
    needs: windows-updater
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate the tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the compiled Versions API
        run: node scripts/test-versions-api.mjs

      - name: Verify the compiled Worlds API and ZIP round trip
        run: node scripts/test-worlds-api.mjs

      - name: Verify queued add-ons through the compiled API
        run: node scripts/test-addon-queue-api.mjs

      - name: Verify add-on queue browser flows
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node scripts/test-addon-queue-ui.mjs

      - name: Create the verified updater package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_name="nodepilot-v${version}-universal.zip"
          stage="release-work/nodepilot-v${version}-universal"

          mkdir -p "$stage"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$stage"
          node scripts/create-release-manifest.mjs "$stage" "$version"
          (
            cd release-work
            zip -qr "../$package_name" "$(basename "$stage")"
          )
          sha256sum "$package_name" | awk '{print $1 "  " $2}' > "$package_name.sha256"

          echo "archive=$package_name" >> "$GITHUB_OUTPUT"
          echo "checksum=$package_name.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}" \
            --title "NodePilot $GITHUB_REF_NAME" \
            --generate-notes
